name: Deploy to GitHub Pages

# The app is plain static files, so "build" is just packaging the repo.
on:
  push:
    branches:
      - main
      - claude/complete-app-development-eq0ote
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
        # Tries to switch Pages on by itself; on repositories where the
        # workflow token may not create the Pages site, the step below explains
        # the one-time manual toggle.
        with:
          enablement: true
      - name: How to enable Pages
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages is not enabled for this repository yet."
          echo "Open  Settings → Pages → Build and deployment → Source  and pick 'GitHub Actions',"
          echo "then re-run this workflow. Nothing in the code needs to change."
          exit 1
      - name: Package the site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'node_modules' \
                --exclude 'lectureflow' \
                --exclude 'tests' --exclude 'tools' --exclude '.tmp' \
                --exclude 'package-lock.json' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
