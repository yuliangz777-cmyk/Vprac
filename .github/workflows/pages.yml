name: Deploy to GitHub Pages

# The app is plain static files, so "build" is just packaging the repo.
on:
  push:
    branches:
      - main
      - claude/complete-app-development-eq0ote
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package the site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'node_modules' \
                --exclude 'tests' --exclude 'tools' --exclude '.tmp' \
                --exclude 'package-lock.json' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
